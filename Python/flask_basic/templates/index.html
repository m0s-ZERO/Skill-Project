<h1>Work List</h1>

{% for work in works %}
    <div>
        <h2>{{ work.name }}</h2>
        <p>Price: {{ work.price }} yen</p>
        <p>Category: {{ work.category }}</p>

        {% if work.price >= 50000 %}
            <p>高価格案件</p>
        {% else %}
            <p>通常案件</p>
        {% endif %}
    </div>
{% endfor %}
