<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="m0sへのWebサイト制作・デザインに関するお問い合わせページです。">
  <title>CONTACT｜m0s Web Creator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="contact.css">
  <script src="contact.js" defer></script>
</head>

<body>
  <header class="contact-header">
    <a href="../index.html" class="contact-logo">m0s</a>
    <a href="../index.html" class="back-link">BACK TO HOME ↗</a>
  </header>

  <main class="contact-main">
    <section class="contact-intro">
      <p class="section-label">CONTACT / 01</p>

      <h1 class="contact-title">
        LET'S<br>
        CREATE<br>
        TOGETHER.
      </h1>

      <p class="contact-description">
        新しいアイデアを、一緒にカタチにしませんか？
        <br>
        お仕事のご相談・お問い合わせはこちらから。
      </p>
    </section>

    <div class="contact-divider" aria-hidden="true">
      <span></span>
    </div>

    <section class="contact-form-section" aria-labelledby="form-heading">
      <div class="form-heading">
        <p class="section-label">SEND A MESSAGE</p>
        <h2 id="form-heading">お問い合わせフォーム</h2>
        <p>必要事項をご入力のうえ、送信してください。</p>
      </div>

      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="contact-name">
            YOUR NAME <span>*</span>
          </label>
          <input type="text" id="contact-name" name="name" placeholder="お名前を入力" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="contact-email">
            EMAIL ADDRESS <span>*</span>
          </label>
          <input type="email" id="contact-email" name="email" placeholder="メールアドレスを入力" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="contact-service">
            SERVICE <span>*</span>
          </label>
          <select id="contact-service" name="service" required>
            <option value="" selected disabled>
              お問い合わせ内容を選択
            </option>
            <option value="web-site">WEB SITE</option>
            <option value="lp">LP</option>
            <option value="corporate">CORPORATE</option>
            <option value="web-app">WEB APP</option>
            <option value="other">OTHER</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contact-message">
            MESSAGE <span>*</span>
          </label>
          <textarea id="contact-message" name="message" rows="10" placeholder="ご相談内容をご入力ください" required></textarea>
        </div>

        <p class="form-note">* 必須項目</p>

        <button type="submit" class="contact-submit">
          <span>SEND MESSAGE</span>
          <span aria-hidden="true">↗</span>
        </button>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="contact-footer">
    <a href="../index.html">← BACK TO PORTFOLIO</a>
    <p>© 2026 m0s</p>
  </footer>
</body>

</html>
