<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Analysis App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="header">
    <h1>Work Analysis</h1>
    <p>作品データを検索・分析するアプリ</p>
  </header>

  <main class="container">
    <section class="search-section">
      <h2>作品を検索する</h2>

      <label for="keyword">キーワード</label>
      <input type="text" id="keyword" placeholder="作品名を入力">

      <label for="category">カテゴリー</label>
      <select id="category">
        <option value="all">すべて</option>
        <option value="Web Site">Web Site</option>
        <option value="Web App">Web App</option>
      </select>

      <label for="min-price">最低価格</label>
      <div class="price-input">
        <input type="number" id="min-price" placeholder="例：10000" min="0" step="1">
        <span>円以上</span>
      </div>

      <label for="max-price">最高価格</label>
      <div class="price-input">
        <input type="number" id="max-price" placeholder="例：50000" min="0" step="1">
        <span>円以下</span>
      </div>

      <label for="sort-order">並び替え</label>
      <select id="sort-order">
        <option value="high">価格が高い順</option>
        <option value="low">価格が安い順</option>
      </select>
      <p id="search-error" class="search-error" role="alert"></p>
      <div class="search-buttons">
        <button id="search-button" class="search-button" type="button">
          検索する
        </button>

        <button id="reset-button" class="reset-button" type="button">
          条件をリセット
        </button>
      </div>
    </section>


    <section class="management-section">
      <h2>作品を管理する</h2>

      <form id="work-form">
        <label for="work-title">作品名</label>
        <input type="text" id="work-title" placeholder="例：New Portfolio" required>

        <label for="work-category">カテゴリー</label>
        <select id="work-category" required>
          <option value="Web Site">Web Site</option>
          <option value="Web App">Web App</option>
        </select>

        <label for="work-price">価格</label>
        <div class="price-input">
          <input type="number" id="work-price" placeholder="例：30000" min="0" step="1" required>
          <span>円</span>
        </div>

        <label for="work-image">画像パス</label>
        <input type="text" id="work-image" placeholder="例：images/new-work.png">

        <button type="submit" id="work-submit-button">
          作品を追加する
        </button>
        <button type="button" id="cancel-edit-button">
          編集をキャンセル
        </button>
      </form>
    </section>


    <section class="summary-section">
      <h2>集計結果</h2>

      <div class="summary-cards">
        <article class="summary-card">
          <p>作品数</p>
          <p class="summary-value">
            <span id="result-count">0</span>
            <span class="summary-unit">件</span>
          </p>
        </article>

        <article class="summary-card">
          <p>合計価格</p>
          <p class="summary-value">
            <span id="result-total">0</span>
            <span class="summary-unit">円</span>
          </p>
        </article>

        <article class="summary-card">
          <p>平均価格</p>
          <p class="summary-value">
            <span id="result-average">0</span>
            <span class="summary-unit">円</span>
          </p>
        </article>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <h2>作品一覧</h2>
        <p id="results-count">全0件</p>
      </div>

      <div id="work-list"></div>
    </section>
  </main>


  <div id="success-popup" class="success-popup" role="status" aria-live="polite">
    <div class="success-popup-content">
      <div class="success-icon">✓</div>
      <h2>追加完了！</h2>
      <p>作品を追加しました。</p>
      <button type="button" id="close-popup-button">閉じる</button>
    </div>
  </div>

</body>

</html>
