<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品・プロジェクト管理アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Project Manager</h1>

  <input id="project-title" placeholder="作品名">
  <input id="project-category" placeholder="カテゴリー">
  <input id="project-description" placeholder="説明">
  <button id="add-project">追加</button>
  <button id="save-project">保存</button>
  <div id="blank-check"></div>

  <input id="search-input" placeholder="作品を検索">
  <button id="search-button">検索</button>

  <select id="category-filter">
    <option value="all">全て</option>
    <option value="Web">Web</option>
    <option value="Music">Music</option>
    <option value="Fashion">Fashion</option>
  </select>

  <select id="sort-filter">
    <option value="asc">名前順</option>
    <option value="desc">名前逆順</option>
    <option value="reset">並び順を戻す</option>
  </select>

  <div id="search-result"></div>

  <div id="project-list"></div>
  <div id="project-detail"></div>

  <script src="script.js"></script>
</body>

</html>
